name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:webview
      - run: npm audit --audit-level=high
      - run: npm run vsix
      - run: npx vsce ls --tree

  desktop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.74.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile-tests
      - run: npm run compile
      - run: xvfb-run -a npx vscode-test --code-version ${{ matrix.vscode }} --timeout 10000

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  web-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
