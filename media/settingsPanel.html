<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; img-src {{cspSource}}; style-src 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Doc Color</title>
    <style nonce="{{nonce}}">
        :root {
            --c-tagname: #4EC9B0;
            --c-delim: #6D8B6D;
            --c-attr: #9CDCFE;
            --c-value: #CE9178;
            --c-attag: #C586C0;
            --c-lineprefix: #6A9955;
            --c-text: #D4D4D4;
        }

        body.vscode-light {
            --c-lineprefix: #008000;
            --c-text: #111827;
        }

        body.vscode-high-contrast,
        body.vscode-high-contrast-light {
            --c-lineprefix: var(--vscode-editor-foreground);
            --c-text: var(--vscode-editor-foreground);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 240px;
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size, 13px);
            color: var(--vscode-foreground);
            background: var(--vscode-sideBar-background, var(--vscode-editor-background));
            line-height: 1.45;
        }

        button,
        input,
        select {
            font: inherit;
        }

        xml-doc-color-app,
        .panel {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .content {
            flex: 1;
            padding: 12px 12px 122px;
        }

        .panel-header {
            display: grid;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border, var(--vscode-widget-border, rgba(127,127,127,0.24)));
        }

        .header-row,
        .section-heading,
        .subheading {
            display: flex;
            min-width: 0;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .title {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 650;
        }

        .scope-badge,
        .source-badge {
            border: 1px solid var(--vscode-badge-background, rgba(127,127,127,0.35));
            border-radius: 999px;
            padding: 1px 7px;
            color: var(--vscode-badge-foreground, var(--vscode-foreground));
            background: var(--vscode-badge-background, rgba(127,127,127,0.16));
            font-size: 10px;
            line-height: 16px;
        }

        .section {
            margin-top: 14px;
        }

        .section-title {
            margin: 0;
            color: var(--vscode-sideBarSectionHeader-foreground, var(--vscode-foreground));
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            opacity: 0.76;
        }

        .section-note,
        .helper-note,
        .preset-note {
            margin: 0;
            color: var(--vscode-descriptionForeground, var(--vscode-foreground));
            font-size: 11px;
        }

        .helper-card {
            display: grid;
            gap: 6px;
            border: 1px solid var(--vscode-widget-border, rgba(127,127,127,0.25));
            border-radius: 6px;
            padding: 10px;
            background: color-mix(in srgb, var(--vscode-editor-background) 82%, transparent);
        }

        .select,
        .lang-select {
            width: 100%;
            height: 28px;
            padding: 3px 7px;
            border: 1px solid var(--vscode-dropdown-border, var(--vscode-input-border, rgba(127,127,127,0.4)));
            border-radius: 3px;
            outline: none;
            color: var(--vscode-dropdown-foreground, var(--vscode-input-foreground));
            background: var(--vscode-dropdown-background, var(--vscode-input-background));
            cursor: pointer;
        }

        .select:focus,
        .lang-select:focus,
        .hex-input:focus {
            border-color: var(--vscode-focusBorder, #007fd4);
        }

        preview-panel,
        language-selector,
        token-color-row,
        action-bar,
        preset-selector {
            display: block;
        }

        .preview {
            border: 1px solid var(--vscode-widget-border, rgba(127,127,127,0.28));
            border-radius: 5px;
            background: var(--vscode-editor-background);
            overflow: hidden;
        }

        .preview-code {
            min-height: 98px;
            margin: 0;
            padding: 10px 11px;
            overflow-x: auto;
            color: var(--c-text);
            font-family: var(--vscode-editor-font-family, Consolas, monospace);
            font-size: var(--vscode-editor-font-size, 12px);
            line-height: 1.65;
            white-space: pre;
        }

        .t-prefix { color: var(--c-lineprefix); }
        .t-delim { color: var(--c-delim); }
        .t-tagname { color: var(--c-tagname); font-weight: 650; }
        .t-attr { color: var(--c-attr); }
        .t-value { color: var(--c-value); }
        .t-attag { color: var(--c-attag); font-weight: 650; }
        .t-text { color: var(--c-text); }

        .token-list {
            display: grid;
            gap: 8px;
        }

        token-color-row[hidden] {
            display: none;
        }

        .color-row {
            display: grid;
            grid-template-columns: minmax(68px, 1fr) auto 18px minmax(66px, 74px) 30px;
            align-items: center;
            gap: 7px;
            min-height: 32px;
            border: 1px solid var(--vscode-widget-border, rgba(127,127,127,0.22));
            border-radius: 5px;
            padding: 5px 6px;
            background: var(--vscode-sideBar-background, var(--vscode-editor-background));
        }

        .color-row.unused {
            opacity: 0.56;
        }

        .color-label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
        }

        .swatch {
            width: 18px;
            height: 18px;
            border: 1px solid rgba(127,127,127,0.5);
            border-radius: 4px;
            background: transparent;
        }

        .hex-input {
            width: 100%;
            height: 22px;
            border: 1px solid var(--vscode-input-border, transparent);
            border-radius: 3px;
            outline: none;
            padding: 2px 5px;
            color: var(--vscode-input-foreground);
            background: var(--vscode-input-background);
            font-family: var(--vscode-editor-font-family, Consolas, monospace);
            font-size: 11px;
            text-transform: uppercase;
        }

        .hex-input.invalid {
            border-color: var(--vscode-inputValidation-errorBorder, #f48771);
            background: var(--vscode-inputValidation-errorBackground, var(--vscode-input-background));
        }

        .color-native {
            width: 30px;
            height: 22px;
            padding: 0;
            border: 1px solid var(--vscode-input-border, rgba(127,127,127,0.4));
            border-radius: 3px;
            background: transparent;
            cursor: pointer;
        }

        .color-native::-webkit-color-swatch-wrapper {
            padding: 1px;
        }

        .color-native::-webkit-color-swatch {
            border: 0;
            border-radius: 2px;
        }

        .action-shell {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
            border-top: 1px solid var(--vscode-widget-border, rgba(127,127,127,0.28));
            background: var(--vscode-sideBar-background, var(--vscode-editor-background));
        }

        .action-bar {
            display: grid;
            gap: 8px;
            padding: 9px 12px 12px;
        }

        .status-note {
            min-height: 16px;
            color: var(--vscode-descriptionForeground, var(--vscode-foreground));
            font-size: 11px;
        }

        .status-note.is-dirty { color: var(--vscode-charts-orange, var(--vscode-editorWarning-foreground)); }
        .status-note.is-invalid { color: var(--vscode-inputValidation-errorForeground, var(--vscode-errorForeground, #f48771)); }
        .status-note.is-applied { color: var(--vscode-testing-iconPassed, var(--vscode-terminal-ansiGreen)); }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        button {
            min-width: 0;
            height: 28px;
            border: 0;
            border-radius: 3px;
            padding: 4px 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        button:disabled {
            cursor: default;
            opacity: 0.5;
        }

        .btn-apply {
            color: var(--vscode-button-foreground);
            background: var(--vscode-button-background);
        }

        .btn-apply:not(:disabled):hover {
            background: var(--vscode-button-hoverBackground);
        }

        .btn-secondary {
            color: var(--vscode-button-secondaryForeground, var(--vscode-foreground));
            background: var(--vscode-button-secondaryBackground, rgba(127,127,127,0.2));
        }

        .btn-secondary:not(:disabled):hover {
            background: var(--vscode-button-secondaryHoverBackground, rgba(127,127,127,0.3));
        }

        @media (max-width: 320px) {
            .content {
                padding-right: 10px;
                padding-left: 10px;
            }

            .color-row {
                grid-template-columns: minmax(58px, 1fr) auto 16px minmax(62px, 70px) 28px;
                gap: 5px;
            }

            .buttons {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>
    <script id="preview-data" type="application/json">{{sidebarPreviewData}}</script>

    <xml-doc-color-app></xml-doc-color-app>

    <script nonce="{{nonce}}">
        const SIDEBAR_PREVIEW_DATA = JSON.parse(document.getElementById('preview-data').textContent);
        const vscode = acquireVsCodeApi();

        const TOKEN_KEYS = [
            'xmlDocTagName',
            'xmlDocTagDelimiter',
            'xmlDocAttribute',
            'xmlDocAttributeValue',
            'xmlDocAtTag',
            'xmlDocLinePrefix',
            'xmlDocText',
        ];

        const TOKEN_LABELS = {
            xmlDocTagName: 'Tag names',
            xmlDocTagDelimiter: 'Delimiters',
            xmlDocAttribute: 'Attributes',
            xmlDocAttributeValue: 'Values',
            xmlDocAtTag: '@-tags',
            xmlDocLinePrefix: 'Line prefix',
            xmlDocText: 'Doc text',
        };

        const CSS_VARS = {
            xmlDocTagName: '--c-tagname',
            xmlDocTagDelimiter: '--c-delim',
            xmlDocAttribute: '--c-attr',
            xmlDocAttributeValue: '--c-value',
            xmlDocAtTag: '--c-attag',
            xmlDocLinePrefix: '--c-lineprefix',
            xmlDocText: '--c-text',
        };

        const PRESET_LABELS = {
            custom: 'Custom',
            default: 'Default',
            dark: 'Dark',
            light: 'Light',
            inherited: 'Inherited Theme',
        };

        const HEX_RE = /^#[0-9A-Fa-f]{6}$/;

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function cloneColors(colors) {
            const result = {};
            for (const key of TOKEN_KEYS) {
                result[key] = colors && colors[key] ? String(colors[key]).toUpperCase() : '';
            }
            return result;
        }

        function cloneOverrides(overrides) {
            const result = {};
            for (const key of TOKEN_KEYS) {
                result[key] = Boolean(overrides && overrides[key]);
            }
            return result;
        }

        function getPreview(language) {
            return SIDEBAR_PREVIEW_DATA.previews[language] || SIDEBAR_PREVIEW_DATA.previews['*'];
        }

        function getScopeLabel(language) {
            if (language === '*') {
                return 'All';
            }
            const option = SIDEBAR_PREVIEW_DATA.options.find((entry) => entry.id === language);
            return option ? option.label.replace(/\s*\(.*\)$/, '') : language;
        }

        class LanguageSelector extends HTMLElement {
            connectedCallback() { this.render(); }
            set data(value) { this._data = value; this.render(); }

            render() {
                const data = this._data || { language: '*', options: [] };
                this.innerHTML = `
                    <select id="lang-select" class="lang-select" aria-label="Language scope">
                        ${data.options.map((option) => `
                            <option value="${escapeHtml(option.id)}"${option.id === data.language ? ' selected' : ''}>
                                ${escapeHtml(option.label)}
                            </option>
                        `).join('')}
                    </select>
                `;

                this.querySelector('select')?.addEventListener('change', (event) => {
                    this.dispatchEvent(new CustomEvent('language-change', {
                        bubbles: true,
                        detail: { language: event.target.value },
                    }));
                });
            }
        }
        customElements.define('language-selector', LanguageSelector);

        class PresetSelector extends HTMLElement {
            connectedCallback() { this.render(); }
            set data(value) { this._data = value; this.render(); }

            render() {
                const data = this._data || { mode: 'custom', note: '' };
                this.innerHTML = `
                    <div class="section">
                        <div class="section-heading">
                            <p class="section-title">Preset</p>
                            <span class="scope-badge">${escapeHtml(PRESET_LABELS[data.mode] || 'Custom')}</span>
                        </div>
                        <select id="preset-select" class="select" aria-label="Color preset">
                            <option value="custom"${data.mode === 'custom' ? ' selected' : ''}>Custom</option>
                            <option value="default"${data.mode === 'default' ? ' selected' : ''}>Default</option>
                            <option value="dark"${data.mode === 'dark' ? ' selected' : ''}>Dark</option>
                            <option value="light"${data.mode === 'light' ? ' selected' : ''}>Light</option>
                            <option value="inherited"${data.mode === 'inherited' ? ' selected' : ''}>Reset to inherited theme</option>
                        </select>
                        <p class="preset-note">${escapeHtml(data.note || '')}</p>
                    </div>
                `;

                this.querySelector('select')?.addEventListener('change', (event) => {
                    this.dispatchEvent(new CustomEvent('preset-change', {
                        bubbles: true,
                        detail: { mode: event.target.value },
                    }));
                });
            }
        }
        customElements.define('preset-selector', PresetSelector);

        class PreviewPanel extends HTMLElement {
            connectedCallback() { this.render(); }
            set preview(value) { this._preview = value; this.render(); }

            render() {
                const preview = this._preview || getPreview('*');
                const lines = preview.lines.map((previewLine) => {
                    const prefix = previewLine.prefix
                        ? `<span class="t-prefix">${escapeHtml(previewLine.prefix)}</span>`
                        : '';
                    return `${prefix}${previewLine.html}`;
                }).join('\n');

                this.innerHTML = `
                    <div class="preview">
                        <pre id="preview-code" class="preview-code" aria-label="${escapeHtml(preview.label)} preview">${lines}</pre>
                    </div>
                `;
            }
        }
        customElements.define('preview-panel', PreviewPanel);

        class TokenColorRow extends HTMLElement {
            connectedCallback() { this.render(); }
            set config(value) { this._config = value; this.render(); }

            render() {
                const config = this._config;
                if (!config) {
                    return;
                }

                this.hidden = Boolean(config.hidden);
                const isValid = HEX_RE.test(config.color);
                const source = config.override ? 'Override' : 'Inherited';
                this.innerHTML = `
                    <div class="color-row${config.unused ? ' unused' : ''}" title="${config.unused ? 'Available for this language, but not shown in the selected preview.' : ''}">
                        <span class="color-label">${escapeHtml(config.label)}</span>
                        <span class="source-badge">${source}</span>
                        <span class="swatch" style="background: ${isValid ? escapeHtml(config.color) : 'transparent'}"></span>
                        <input class="hex-input${isValid ? '' : ' invalid'}" type="text" maxlength="7" spellcheck="false" value="${escapeHtml(config.color)}" aria-label="${escapeHtml(config.label)} hex color">
                        <input class="color-native" type="color" value="${isValid ? escapeHtml(config.color) : '#000000'}" aria-label="${escapeHtml(config.label)} color picker">
                    </div>
                `;

                const hexInput = this.querySelector('.hex-input');
                const colorInput = this.querySelector('.color-native');

                colorInput?.addEventListener('input', () => {
                    this.updateColor(colorInput.value.toUpperCase(), 'pick');
                });

                hexInput?.addEventListener('input', () => {
                    this.updateColor(hexInput.value.trim().toUpperCase(), 'hex');
                });

                hexInput?.addEventListener('blur', () => {
                    if (!HEX_RE.test(hexInput.value.trim())) {
                        hexInput.value = colorInput.value.toUpperCase();
                        hexInput.classList.remove('invalid');
                        this.updateColor(hexInput.value, 'hex');
                    }
                });
            }

            updateColor(color, source) {
                const key = this._config.key;
                const valid = HEX_RE.test(color);
                const hexInput = this.querySelector('.hex-input');
                const colorInput = this.querySelector('.color-native');
                const swatch = this.querySelector('.swatch');

                if (hexInput) {
                    hexInput.classList.toggle('invalid', !valid);
                    if (source !== 'hex') {
                        hexInput.value = color;
                    }
                }

                if (valid) {
                    if (colorInput && source !== 'pick') {
                        colorInput.value = color;
                    }
                    if (swatch) {
                        swatch.style.background = color;
                    }
                    document.documentElement.style.setProperty(CSS_VARS[key], color);
                }

                this.dispatchEvent(new CustomEvent('color-change', {
                    bubbles: true,
                    detail: { key, color, valid },
                }));
            }
        }
        customElements.define('token-color-row', TokenColorRow);

        class ActionBar extends HTMLElement {
            connectedCallback() { this.render(); }
            set state(value) { this._state = value; this.render(); }

            render() {
                const state = this._state || {
                    status: 'Loading current colors...',
                    statusClass: '',
                    canApply: false,
                    canReset: false,
                    canCopy: false,
                };
                this.innerHTML = `
                    <div class="action-shell">
                        <div class="action-bar">
                            <div class="status-note ${escapeHtml(state.statusClass)}">${escapeHtml(state.status)}</div>
                            <div class="buttons">
                                <button class="btn-apply" id="btn-apply" type="button"${state.canApply ? '' : ' disabled'}>Apply</button>
                                <button class="btn-secondary" id="btn-copy" type="button"${state.canCopy ? '' : ' disabled'}>Copy JSON</button>
                                <button class="btn-secondary" id="btn-reset" type="button"${state.canReset ? '' : ' disabled'}>Reset</button>
                            </div>
                        </div>
                    </div>
                `;

                this.querySelector('#btn-apply')?.addEventListener('click', () => {
                    this.dispatchEvent(new CustomEvent('apply-colors', { bubbles: true }));
                });
                this.querySelector('#btn-copy')?.addEventListener('click', () => {
                    this.dispatchEvent(new CustomEvent('copy-json', { bubbles: true }));
                });
                this.querySelector('#btn-reset')?.addEventListener('click', () => {
                    this.dispatchEvent(new CustomEvent('reset-colors', { bubbles: true }));
                });
            }
        }
        customElements.define('action-bar', ActionBar);

        class XmlDocColorApp extends HTMLElement {
            constructor() {
                super();
                this.language = '*';
                this.colors = {};
                this.appliedColors = null;
                this.overrides = {};
                this.invalidKeys = new Set();
                this.loaded = false;
                this.supportedEditorActive = false;
                this.activeEditorLanguage = '';
                this.availablePresets = {};
                this.presetMode = 'custom';
            }

            connectedCallback() {
                this.render();
                this.addEventListener('language-change', (event) => this.changeLanguage(event.detail.language));
                this.addEventListener('preset-change', (event) => this.changePreset(event.detail.mode));
                this.addEventListener('color-change', (event) => this.updateColor(event.detail));
                this.addEventListener('apply-colors', () => this.applyColors());
                this.addEventListener('copy-json', () => this.copyJson());
                this.addEventListener('reset-colors', () => this.resetColors());
                window.addEventListener('message', (event) => this.handleMessage(event.data));
                vscode.postMessage({ type: 'ready' });
            }

            handleMessage(message) {
                if (!message || message.type !== 'init') {
                    return;
                }

                this.loaded = true;
                this.language = typeof message.language === 'string' ? message.language : '*';
                this.colors = cloneColors(message.colors);
                this.appliedColors = cloneColors(message.colors);
                this.overrides = cloneOverrides(message.overrides);
                this.supportedEditorActive = Boolean(message.supportedEditorActive);
                this.activeEditorLanguage = message.activeEditorLanguage || '';
                this.availablePresets = message.availablePresets || {};
                this.invalidKeys.clear();
                this.presetMode = 'custom';
                this.applyPreviewColors();
                this.render();
            }

            changeLanguage(language) {
                this.language = language;
                this.loaded = false;
                this.appliedColors = null;
                this.invalidKeys.clear();
                vscode.postMessage({ type: 'changeLanguage', language });
                this.render();
            }

            changePreset(mode) {
                this.presetMode = mode;
                if (mode !== 'custom') {
                    const presetColors = this.availablePresets[mode];
                    if (presetColors) {
                        this.colors = cloneColors(presetColors);
                        const overrideValue = mode !== 'inherited';
                        for (const key of TOKEN_KEYS) {
                            this.overrides[key] = overrideValue;
                        }
                        this.applyPreviewColors();
                    }
                }
                this.render();
            }

            updateColor(detail) {
                this.colors[detail.key] = detail.color;
                this.overrides[detail.key] = true;
                this.presetMode = 'custom';
                if (detail.valid) {
                    this.invalidKeys.delete(detail.key);
                } else {
                    this.invalidKeys.add(detail.key);
                }
                this.updateActionBar();
            }

            applyColors() {
                if (!this.getActionState().canApply) {
                    return;
                }
                vscode.postMessage({
                    type: 'apply',
                    colors: this.collectColors(),
                    mode: this.presetMode,
                });
            }

            copyJson() {
                if (!this.loaded || this.invalidKeys.size > 0) {
                    return;
                }
                vscode.postMessage({
                    type: 'copyJson',
                    colors: this.collectColors(),
                    language: this.language,
                });
            }

            resetColors() {
                if (!this.loaded) {
                    return;
                }
                this.presetMode = 'custom';
                vscode.postMessage({ type: 'reset' });
            }

            collectColors() {
                const result = {};
                for (const key of TOKEN_KEYS) {
                    result[key] = this.colors[key] || '';
                }
                return result;
            }

            applyPreviewColors() {
                for (const key of TOKEN_KEYS) {
                    if (this.colors[key]) {
                        document.documentElement.style.setProperty(CSS_VARS[key], this.colors[key]);
                    }
                }
            }

            hasUnsavedChanges() {
                if (!this.loaded || !this.appliedColors || this.invalidKeys.size > 0) {
                    return false;
                }
                if (this.presetMode === 'inherited') {
                    return true;
                }
                return TOKEN_KEYS.some((key) => this.colors[key] !== this.appliedColors[key]);
            }

            getPresetNote() {
                switch (this.presetMode) {
                    case 'default':
                        return 'Applies the built-in default palette.';
                    case 'dark':
                        return 'Uses the bundled dark-friendly palette.';
                    case 'light':
                        return 'Uses the bundled light-friendly palette.';
                    case 'inherited':
                        return 'Apply will remove XML Doc Color overrides for this scope.';
                    default:
                        return 'Custom keeps your edited token colors.';
                }
            }

            getActionState() {
                if (!this.loaded) {
                    return {
                        status: 'Loading current colors...',
                        statusClass: '',
                        canApply: false,
                        canReset: false,
                        canCopy: false,
                    };
                }

                if (this.invalidKeys.size > 0) {
                    return {
                        status: 'Enter valid 6-digit hex colors before applying.',
                        statusClass: 'is-invalid',
                        canApply: false,
                        canReset: true,
                        canCopy: false,
                    };
                }

                if (this.hasUnsavedChanges()) {
                    return {
                        status: this.presetMode === 'inherited'
                            ? 'Apply will restore inherited theme colors for this scope.'
                            : 'Unapplied changes for the selected scope.',
                        statusClass: 'is-dirty',
                        canApply: true,
                        canReset: true,
                        canCopy: true,
                    };
                }

                return {
                    status: 'Colors applied to the selected scope.',
                    statusClass: 'is-applied',
                    canApply: false,
                    canReset: true,
                    canCopy: true,
                };
            }

            render() {
                const preview = getPreview(this.language);
                const xmlOnly = !preview.usesAtTags;
                this.innerHTML = `
                    <div class="panel">
                        <main class="content">
                            <header class="panel-header">
                                <div class="header-row">
                                    <h1 class="title">XML Doc Color</h1>
                                    <span class="scope-badge">${escapeHtml(getScopeLabel(this.language))}</span>
                                </div>
                                <language-selector></language-selector>
                            </header>

                            ${this.supportedEditorActive ? '' : `
                                <section class="section">
                                    <div class="helper-card">
                                        <div class="subheading">
                                            <p class="section-title">Onboarding</p>
                                            <span class="scope-badge">Tip</span>
                                        </div>
                                        <p class="helper-note">Open a supported file to compare the preview with live semantic tokens in the editor.</p>
                                        <p class="helper-note">Supported languages: C#, VB.NET, F#, Java, TypeScript, JavaScript, PHP, Kotlin.</p>
                                    </div>
                                </section>
                            `}

                            <preset-selector></preset-selector>

                            <section class="section" aria-label="Preview">
                                <div class="section-heading">
                                    <p class="section-title">Preview</p>
                                    <span class="scope-badge">${this.activeEditorLanguage ? escapeHtml(this.activeEditorLanguage) : 'Static'}</span>
                                </div>
                                <p class="section-note">Rows marked Inherited currently come from theme or fallback defaults rather than explicit overrides.</p>
                                <preview-panel></preview-panel>
                            </section>

                            <section class="section" aria-label="Token colors">
                                <div class="section-heading">
                                    <p class="section-title">${xmlOnly ? 'Tag & Attribute Colors' : 'Token Colors'}</p>
                                    <p class="section-note">${this.hasUnusedRows(preview, xmlOnly) ? 'Dimmed rows are available outside this preview.' : ''}</p>
                                </div>
                                <div class="token-list"></div>
                            </section>
                        </main>
                        <action-bar></action-bar>
                    </div>
                `;

                this.querySelector('language-selector').data = {
                    language: this.language,
                    options: SIDEBAR_PREVIEW_DATA.options,
                };

                this.querySelector('preset-selector').data = {
                    mode: this.presetMode,
                    note: this.getPresetNote(),
                };

                this.querySelector('preview-panel').preview = preview;
                this.renderTokenRows(preview, xmlOnly);
                this.updateActionBar();
            }

            renderTokenRows(preview, xmlOnly) {
                const list = this.querySelector('.token-list');
                for (const key of TOKEN_KEYS) {
                    const row = document.createElement('token-color-row');
                    row.config = {
                        key,
                        label: TOKEN_LABELS[key],
                        color: this.colors[key] || '#000000',
                        hidden: key === 'xmlDocAtTag' && xmlOnly,
                        override: Boolean(this.overrides[key]),
                        unused: !(key === 'xmlDocAtTag' && xmlOnly) && !preview.usedTokenKeys.includes(key),
                    };
                    list.appendChild(row);
                }
            }

            hasUnusedRows(preview, xmlOnly) {
                return TOKEN_KEYS.some((key) => key !== 'xmlDocAtTag' || !xmlOnly)
                    && TOKEN_KEYS.some((key) => !(key === 'xmlDocAtTag' && xmlOnly) && !preview.usedTokenKeys.includes(key));
            }

            updateActionBar() {
                const actionBar = this.querySelector('action-bar');
                if (actionBar) {
                    actionBar.state = this.getActionState();
                }
            }
        }
        customElements.define('xml-doc-color-app', XmlDocColorApp);
    </script>
</body>
</html>
